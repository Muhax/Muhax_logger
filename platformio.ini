; MUHAX Logger QR - ESP32-2432S028R "CYD"
[env:cyd]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ricmoo/QRCode@^0.0.1
    bblanchon/ArduinoJson@^7.0.4

; TFT_eSPI is configured here, so you do NOT edit User_Setup.h.
; If colours look inverted, add -DTFT_INVERSION_ON (or remove it).
; If the screen stays white/garbled, your board is the ST7789 version:
; replace -DILI9341_2_DRIVER with -DST7789_DRIVER and add -DTFT_INVERSION_OFF.
; Provide these as local shell environment variables before building; do not put credentials in this file.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMUHAX_WIFI_SSID=\"${sysenv.MUHAX_WIFI_SSID}\"
    -DMUHAX_WIFI_PASSWORD=\"${sysenv.MUHAX_WIFI_PASSWORD}\"
    -DMUHAX_WIFI_IP=\"${sysenv.MUHAX_WIFI_IP}\"
    -DMUHAX_WIFI_GATEWAY=\"${sysenv.MUHAX_WIFI_GATEWAY}\"
    -DMUHAX_WIFI_SUBNET=\"${sysenv.MUHAX_WIFI_SUBNET}\"
    -DMUHAX_WIFI_DNS=\"${sysenv.MUHAX_WIFI_DNS}\"
    -DMUHAX_GITHUB_OWNER=\"${sysenv.MUHAX_GITHUB_OWNER}\"
    -DMUHAX_GITHUB_REPO=\"${sysenv.MUHAX_GITHUB_REPO}\"
    -DMUHAX_GITHUB_BRANCH=\"${sysenv.MUHAX_GITHUB_BRANCH}\"
    -DMUHAX_GITHUB_TOKEN=\"${sysenv.MUHAX_GITHUB_TOKEN}\"
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
