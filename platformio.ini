; MUHAX Logger - ESP32-2432S028R "CYD"
; Build:  pio run            Upload: pio run -t upload            Monitor: pio device monitor
; Default env "cyd" = ILI9341 (most common, 1 USB port). If colors look inverted or the
; screen is blank, try "cyd_st7789" (2-USB-port revision) or "cyd_ili9341_inv".

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit PN532@^1.3.4
    bblanchon/ArduinoJson@^7.2.0
    ricmoo/QRCode@^0.0.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_ENABLE_COMMENTS=0
    ; PN532 over UART on GPIO35 (RX) / GPIO22 (TX). Remove this line for I2C (SDA=27, SCL=22).
    -DPN532_UART=1
    ; ---- TFT_eSPI configured here (no User_Setup.h edits needed) ----
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd_ili9341_inv]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR

; Pin identification helper (flashes a tiny sketch that only toggles GPIO 22). Not the real firmware.
[env:pintest]
build_src_filter = -<*> +<../pintest/pintest.cpp>
lib_deps =
build_flags =

; PN532 UART diagnostic (prints raw replies on the serial monitor). Not the real firmware.
[env:nfctest]
build_src_filter = -<*> +<../pintest/nfctest.cpp>
lib_deps =
build_flags =

; I2C scanner for the PN532 (expects a device at 0x24). Not the real firmware.
[env:i2ctest]
build_src_filter = -<*> +<../pintest/i2ctest.cpp>
lib_deps =
build_flags =
